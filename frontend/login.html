<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Sign in | Summit Terrace</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/api.js"></script>
    <script defer src="assets/js/auth.js"></script>
  </head>
  <body class="simple-auth">
    <main class="auth-card-wrap">
      <a class="brand auth-brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-copy">
          <span class="brand-name">Summit Terrace</span>
          <span class="brand-sub">Mountain-view dining</span>
        </span>
      </a>

      <form class="auth-form" id="loginForm">
        <div class="eyebrow">Welcome back</div>
        <h1>Sign in</h1>
        <p>Sign in to manage your details and make your next reservation.</p>

        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div
          class="notice"
          id="authNotice"
          role="status"
          aria-live="polite"
        ></div>

        <button class="btn btn-primary btn-full auth-submit" type="submit">
          Sign in <span aria-hidden="true">→</span>
        </button>

        <p class="auth-foot">
          Don't have an account?
          <a class="text-link" href="register.html">Create one</a>
        </p>
      </form>

      <a class="back-link auth-back" href="index.html">← Back to home</a>
    </main>
  </body>
</html>
