<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Create an account | Summit Terrace</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script defer src="assets/js/config.js"></script>
    <script defer src="assets/js/api.js"></script>
    <script defer src="assets/js/auth.js"></script>
  </head>
  <body class="simple-auth">
    <main class="auth-card-wrap auth-register-wrap">
      <a class="brand auth-brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-copy">
          <span class="brand-name">Summit Terrace</span>
          <span class="brand-sub">Mountain-view dining</span>
        </span>
      </a>

      <form class="auth-form" id="registerForm">
        <div class="eyebrow">Make future bookings easier</div>
        <h1>Create account</h1>
        <p>
          Create an account to make future bookings easier. Prefer not to
          register? You can book as a guest.
        </p>

        <div class="field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            autocomplete="username"
            maxlength="80"
            placeholder="Create a username"
            required
          />
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="field">
          <label for="phoneNumber">
            Your phone number <span class="optional-label">Optional</span>
          </label>
          <input
            id="phoneNumber"
            name="phoneNumber"
            type="tel"
            autocomplete="tel"
            maxlength="30"
            placeholder="Your phone number"
          />
        </div>

        <div class="form-grid auth-password-grid">
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="At least 8 characters"
              required
            />
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="Repeat password"
              required
            />
          </div>
        </div>

        <div
          class="notice"
          id="authNotice"
          role="status"
          aria-live="polite"
        ></div>

        <button class="btn btn-primary btn-full auth-submit" type="submit">
          Create account <span aria-hidden="true">→</span>
        </button>

        <p class="auth-foot">
          Already have an account?
          <a class="text-link" href="login.html">Sign in</a>
        </p>
      </form>

      <a class="back-link auth-back" href="index.html">← Back to home</a>
    </main>
  </body>
</html>
